<helmet>
<style>

:root{
  --bg:oklch(98% 0.004 255);
  --surface:oklch(100% 0 0);
  --surface-alt:oklch(96.5% 0.006 255);
  --border:oklch(90% 0.007 255);
  --border-soft:oklch(93.5% 0.006 255);
  --text:oklch(25% 0.021 258);
  --text-soft:oklch(46% 0.021 258);
  --text-faint:oklch(63% 0.016 258);
  --accent:oklch(55% 0.163 258);
  --accent-dark:oklch(46% 0.15 258);
  --accent-soft:oklch(93.5% 0.032 258);
  --on-accent:oklch(99% 0 0);
  --success:oklch(60% 0.135 152);
  --success-soft:oklch(94% 0.045 152);
  --warning:oklch(73% 0.14 78);
  --warning-soft:oklch(94% 0.06 78);
  --danger:oklch(57% 0.19 24);
  --danger-soft:oklch(94% 0.05 24);
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface-alt);color:var(--text);}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--accent-dark);}
.device{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--border);}
.statusgap{height:47px;flex-shrink:0;}
.navbar{flex-shrink:0;display:flex;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--border-soft);}
.navrow{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 8px;}
.navbtn{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:15px;font-weight:510;padding:6px 8px;min-height:44px;}
.navtitle-small{font-size:15px;font-weight:600;color:var(--text);}
.navactions{display:flex;align-items:center;gap:2px;padding-right:4px;}
.iconbtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.largetitle{padding:2px 16px 12px;}
.largetitle h1{margin:0;font-size:30px;font-weight:750;letter-spacing:-0.4px;color:var(--text);}
.largetitle p{margin:2px 0 0;font-size:14px;color:var(--text-soft);}
.content{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px;}
.tabbar{flex-shrink:0;display:flex;border-top:1px solid var(--border-soft);background:var(--bg);padding-top:8px;}
.tabbargap{height:22px;flex-shrink:0;background:var(--bg);}
.tabitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:560;padding-bottom:2px;}
.tabitem.active{color:var(--accent);}
.section{padding:20px 16px 4px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px 2px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px 2px;}
.section-head .link{font-size:13px;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;}
.grouplist{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;overflow:hidden;}
.grouprow{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:44px;border-bottom:1px solid var(--border-soft);}
.grouprow:last-child{border-bottom:none;}
.grouprow .label{flex:1;font-size:15px;font-weight:500;color:var(--text);}
.grouprow .value{font-size:15px;color:var(--text-faint);}
.grouprow.danger .label{color:var(--danger);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:3px 8px 3px 6px;border-radius:100px;}
.badge.success{background:var(--success-soft);color:var(--success);}
.badge.warning{background:var(--warning-soft);color:oklch(48% 0.11 78);}
.badge.accent{background:var(--accent-soft);color:var(--accent-dark);}
.badge.neutral{background:var(--surface-alt);color:var(--text-soft);border:1px solid var(--border);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-size:16px;font-weight:650;border:none;width:100%;}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-outline-white{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-ghost{background:transparent;color:var(--accent);}
.input{height:50px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:15.5px;color:var(--text);display:flex;align-items:center;}
.input .placeholder{color:var(--text-faint);}
.field-label{font-size:12.5px;font-weight:650;color:var(--text-soft);margin:0 0 6px 2px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:100px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.avatar{border-radius:100px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.hr{height:1px;background:var(--border-soft);border:none;margin:0;}
.progressbar{height:6px;border-radius:100px;background:var(--surface-alt);overflow:hidden;}
.progressbar > div{height:100%;background:var(--accent);border-radius:100px;}
.stepper{display:flex;align-items:center;gap:6px;padding:14px 16px 2px;}
.stepdot{flex:1;height:4px;border-radius:100px;background:var(--border);}
.stepdot.done{background:var(--accent);}

</style>
</helmet>

  <div style="width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:currentColor;flex-shrink:0;" ><path d="M7 4h-.5A2.5 2.5 0 0 0 4 6.5V7M17 4h.5A2.5 2.5 0 0 1 20 6.5V7M7 20h-.5A2.5 2.5 0 0 1 4 17.5V17M17 20h.5a2.5 2.5 0 0 0 2.5-2.5V17"/><path d="M9 10.5v1M15 10.5v1M9 15c1 .8 5 .8 6 0"/></svg></div>

</div><div style="display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:12px;font-weight:600;"><div class="hr" style="flex:1;"></div>or<div class="hr" style="flex:1;"></div></div><div style="display:flex;align-items:center;justify-content:flex-start;gap:10px;"><button class="btn btn-outline-white" style="height:48px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:currentColor;flex-shrink:0;" ><path d="M15.5 4.2c-.9.1-2 .7-2.6 1.5-.6.7-1.1 1.7-.9 2.7 1 .1 2.1-.6 2.7-1.4.6-.7 1-1.7.8-2.8Z"/><path d="M18.9 17.2c-.4.9-.6 1.3-1.1 2.1-.7 1.1-1.7 2.5-2.9 2.5-1.1 0-1.4-.7-2.9-.7s-1.9.7-2.9.7c-1.2 0-2.1-1.3-2.8-2.4-1.9-3-2.1-6.5-.9-8.3.8-1.3 2.1-2.1 3.4-2.1 1.2 0 2 .7 2.9.7s1.6-.7 3-.7c1 0 2.1.5 2.8 1.4-2.5 1.4-2.1 5 .4 6.8Z"/></svg>Apple</button><button class="btn btn-outline-white" style="height:48px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:currentColor;flex-shrink:0;" ><circle cx="12" cy="12" r="9"/><path d="M12 12h6.2c.1.5.2 1 .2 1.6 0 3.6-2.4 6.1-6.4 6.1a7.7 7.7 0 1 1 0-15.4c2 0 3.6.7 4.9 1.9l-2 1.9a4.6 4.6 0 0 0-2.9-1c-2.5 0-4.5 2.1-4.5 4.6s2 4.6 4.5 4.6c2.2 0 3.6-1.2 4-2.9H12v-2.4Z" fill="currentColor" stroke="none"/></svg>Google</button></div></div><div style="height:18px;flex-shrink:0;"></div><div style="padding:0 16px;"><button class="btn btn-primary">Log In</button></div><div style="height:16px;flex-shrink:0;"></div><div style="padding:0 16px;"><div style="text-align:center;font-size:13.5px;color:var(--text-soft);">New to Boliviq? <a style="font-weight:650;">Create an account</a></div></div><div style="height:20px;flex-shrink:0;"></div>
